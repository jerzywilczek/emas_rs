[package]
name = "emas_rs"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
crossbeam = "0.8.2"
rand = "0.8.5"
rand_chacha = "0.3.1"
rand_pcg = "0.3.1"
rayon = "1.6.0"
rustc-hash = "1.1.0"

[dev-dependencies]
assert_approx_eq = "1.1.0"
criterion = { version = "0.4", features = ["html_reports"] }

[[bench]]
name = "full_benchmark"
harness = false
